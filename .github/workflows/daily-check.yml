name: 收息股每日盯盘

on:
  schedule:
    # 注意：GitHub 的 cron 一律按 UTC 计算
    # 北京时间 15:10（收盘后 10 分钟）= UTC 07:10；1-5 表示周一到周五
    - cron: "10 7 * * 1-5"
  workflow_dispatch: {} # 允许在网页上手动点一下运行，方便测试

# 需要写权限：把 state/state.json 提交回仓库（去重 + 保活）
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓行情并推送微信
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python scripts/check_dividend_stocks.py

      - name: 把状态文件提交回仓库
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain state/)" ]; then
            git add state/
            git commit -m "chore(state): $(date -u +%Y-%m-%d)"
            git push
          else
            echo "状态未变化，跳过提交"
          fi
